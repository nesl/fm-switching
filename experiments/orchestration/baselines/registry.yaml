    verified: "VERIFIED 2026-11-12 from the ICLR 2026 poster page supplied by the user (https://iclr.cc/virtual/2026/poster/10011335): title, five authors, abstract and OpenReview id 738HjJEbml; author-linked code at https://github.com/Zhangkr2003/QueryStream (Apache-2.0)"
    card: null
    notes: "VERIFIED, NOT BUILT, per the user rule that it be built only if the mechanism is fully specified. MISSING COMPONENT: the RTAR trigger rule. The paper has two parts - QDP (Query-aware Differential Pruning, filtering visual tokens by query relevance and temporal novelty) and RTAR (Relevance-Triggered Active Response, which decides when to respond). The addendum asked for the gating/response logic, i.e. RTAR. RTAR is NAMED in the repo README but neither DEFINED there nor IMPLEMENTED in the release: the repo README own At-a-glance table says the released inference is Single-query QDP, and the released querystream/ tree contains only demo/infer.py plus a patched Qwen2.5-VL, with no RTAR code (grep for rtar/proactive/trigger/should_respond finds only README prose). The OpenReview PDF would not fetch and the OpenReview API returns 403, so the relevance statistic and the trigger condition could not be read. Building it would mean inventing the trigger. SEPARATELY, QDP prunes visual tokens INSIDE the model, which our action space cannot express in any case. TO BUILD IT we need RTAR fully specified - the statistic and the firing condition - from the paper PDF or an RTAR implementation."
