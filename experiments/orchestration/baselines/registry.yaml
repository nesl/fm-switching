  - name: "tuned-engine"
    experiments: 
      - "C-mixed"
    case: "own"
    paper: null
    verified: null
    code_url: "ours (StudyE10c)"
    pinned_commit: null
    license: null
    decides: "engine configuration"
    card: "cards/tuned_engine.md"
    notes: "DECIDED BY THE USER 2026-11-12: tuned-engine = StudyE10e P1 (--long-prefill-token-threshold 1024, default step budget, FCFS). It does NOT restore capacity - StudyE10e pre-registered verdict that no config removes the cold-recall interference stands, and P1 is five ladder levels below its own C0 under recall - but it cuts episodic p99 19-25 % at C1 and 18-30 % at C4 at NO C0 capacity cost, and alone among P1/P2/P3 it spares warm recall (C4 append x1.02, escalation x1.01, against P2 x1.37/x1.30 and P3 x1.53/x2.09). Its cost is confined to cold recall: TTFT p99 x1.12 at C1, x1.14 at C4. The module exposes all seven measured configurations (E10c E0/E1/E2/E4 + E10e P1/P2/P3), keeps TUNED=P1 and BEST_MEASURED=E0 as separate recorded senses, and KEEPS THE GUARD that raises on any unmeasured name. Card records StudyE10c, E10d and E10e verdicts and all measured costs."
    versions:
      - "adapted"
    files:
      - "tuned_engine.py"
